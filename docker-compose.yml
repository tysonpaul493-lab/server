version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mariadb:10.11
    container_name: liferoute_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: liferoute
      MYSQL_USER: liferoute_user
      MYSQL_PASSWORD: liferoute_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/liferoute_database.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - liferoute_net

  # Laravel HTTP API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liferoute_api
    restart: always
    environment:
      - APP_NAME=LifeRoute
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=liferoute
      - DB_USERNAME=liferoute_user
      - DB_PASSWORD=liferoute_pass
      - WS_HOST=websocket
      - WS_PORT=8080
      - WS_INTERNAL_PORT=8081
    depends_on:
      - mysql
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    networks:
      - liferoute_net

  # Laravel Reverb / WebSocket Server
  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liferoute_websocket
    restart: always
    environment:
      - APP_NAME=LifeRoute
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=liferoute
      - DB_USERNAME=liferoute_user
      - DB_PASSWORD=liferoute_pass
      - WS_HOST=0.0.0.0
      - WS_PORT=8080
      - WS_INTERNAL_PORT=8081
    depends_on:
      - mysql
    ports:
      - "8080:8080"
      - "8081:8081"
    command: php artisan websocket:serve --host=0.0.0.0 --port=8080 --internal-port=8081
    networks:
      - liferoute_net

networks:
  liferoute_net:
    driver: bridge

volumes:
  mysql_data:
