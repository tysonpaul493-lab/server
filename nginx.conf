# LifeRoute Unified Server - Nginx Reverse Proxy Configuration
# Proxies REST API to port 8000 and WebSockets (Reverb) to port 8080

server {
    listen 80;
    server_name your-domain.com api.your-domain.com;

    root /var/www/liferoute/server/public;
    index index.php index.html;

    client_max_body_size 50M;

    # CORS Headers for Mobile & Web Applications
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With, Origin' always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # REST API & Laravel Endpoints
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000; # or unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    # Live WebSocket Reverse Proxy (Port 8080 / Laravel Reverb)
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
